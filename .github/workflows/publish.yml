name: Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  java-version: '21'
  curseforge-id: 920581

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up JDK ${{ env.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.java-version }}
        distribution: 'temurin'

    - name: Ensure Modrinth project exists
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: |
        curl -sS -X POST https://api.modrinth.com/v2/project \
          -H "Authorization: $MODRINTH_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"slug":"wsmc-kotlin","title":"WSMC-Kotlin","description":"WebSocket support for Minecraft Java (client side). Kotlin rewrite of WSMC, for Forge / NeoForge / Fabric.","license_id":"LicenseRef-All-Rights-Reserved","categories":["forge","fabric","neoforge","utility"],"client_side":"required","server_side":"unsupported","project_type":"mod","source_url":"https://github.com/coolxitech/wsmc-kotlin","issues_url":"https://github.com/coolxitech/wsmc-kotlin/issues","requested_status":"approved"}' || true

    - name: Build Fabric
      run: |
        cd fabric
        chmod +x ./gradlew
        ./gradlew exportProperties build
        cd ..

    - name: Build neoforge
      run: |
        cd neoforge
        chmod +x ./gradlew
        ./gradlew exportProperties build
        cd ..

    - name: Build forge
      run: |
        cd forge
        chmod +x ./gradlew
        ./gradlew exportProperties build
        cd ..

    - name: Get Info and Perform Substitutions
      run: |
        # Parse common.properties into key-value pairs
        function parse_gradle_props() {
          RETURNVAL=$(grep -v '^\s*#' $1 | sed -e 's/^[ \t]*//;s/[ \t]*$//' | sed -e 's/[ \t]*=[ \t]*/=/' | grep -E -v '^[^=]*\.[^=]*=')
          echo "$RETURNVAL"
        }

        # Get the value of a key from a set of key-value pairs
        get_prop_value() {
          local props="$1"
          local search_key="$2"

          while IFS= read -r line; do
            # Skip empty lines
            [[ -z "$line" ]] && continue

            key=$(echo "$line" | cut -d= -f1)
            value=$(echo "$line" | cut -d= -f2-)

            if [[ "$key" == "$search_key" ]]; then
              echo "$value"
              return 0
            fi
          done <<< "$props"

          return 1 # Return non-zero if key is not found
        }

        # Generate dynamic strings based on the build configuration
        function set_action_env() {
          echo "$1"="$2" >> $GITHUB_ENV
        }

        PROPS=$(parse_gradle_props fabric/build/info/properties.txt)
        mod_version=$(get_prop_value "$PROPS" "mod_version")
        minecraft_versions_declared=$(get_prop_value "$PROPS" "minecraft_versions_declared")
        minecraft_version=$(get_prop_value "$PROPS" "minecraft_version")
        publish_prefix=$(get_prop_value "$PROPS" "publish_prefix")
        minecraft_version_range=$(get_prop_value "$PROPS" "minecraft_version_range")
        set_action_env "GITHUB_RELEASE_TITLE" "${mod_version} for Minecraft Forge, Neoforge, and Fabric ${minecraft_versions_declared}"
        set_action_env "GITHUB_TAG_NAME" "v${mod_version}-mc${minecraft_version}"
        set_action_env "MOD_VERSION" "${mod_version}"
        set_action_env "MC_VERSION" "${minecraft_version}"
        set_action_env "CURSEFORGE_FABRIC" "${publish_prefix}-fabric"
        set_action_env "MC_RANGE_FABRIC" "${minecraft_version_range}"

        PROPS=$(parse_gradle_props neoforge/build/info/properties.txt)
        publish_prefix=$(get_prop_value "$PROPS" "publish_prefix")
        minecraft_version_range=$(get_prop_value "$PROPS" "minecraft_version_range")
        set_action_env "CURSEFORGE_NEOFORGE" "${publish_prefix}-neoforge"
        set_action_env "MC_RANGE_NEOFORGE" "${minecraft_version_range}"

        PROPS=$(parse_gradle_props forge/build/info/properties.txt)
        publish_prefix=$(get_prop_value "$PROPS" "publish_prefix")
        minecraft_version_range=$(get_prop_value "$PROPS" "minecraft_version_range")
        set_action_env "CURSEFORGE_FORGE" "${publish_prefix}-forge"
        set_action_env "MC_RANGE_FORGE" "${minecraft_version_range}"

    - name: Publish to CurseForge (Fabric version)
      uses: Kir-Antipov/mc-publish@v3.3.1
      with:
        changelog-file: CHANGELOG.txt
        # Only include this section if you wish to publish your assets on CurseForge.
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.CURSEFORGE_FABRIC }}
        game-versions: "${{ env.MC_RANGE_FABRIC }}"
        version-type: release
        files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
        java: Java ${{ env.java-version }}

    - name: Publish to CurseForge (Neoforge version)
      uses: Kir-Antipov/mc-publish@v3.3.1
      with:
        changelog-file: CHANGELOG.txt
        # Only include this section if you wish to publish your assets on CurseForge.
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.CURSEFORGE_NEOFORGE }}
        game-versions: "${{ env.MC_RANGE_NEOFORGE }}"
        loaders: neoforge
        version-type: beta
        files: neoforge/build/libs/!(*-@(dev|sources|javadoc|slim)).jar
        java: Java ${{ env.java-version }}

    - name: Publish to CurseForge (Forge version)
      uses: Kir-Antipov/mc-publish@v3.3.1
      with:
        changelog-file: CHANGELOG.txt
        # Only include this section if you wish to publish your assets on CurseForge.
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.CURSEFORGE_FORGE }}
        game-versions: "${{ env.MC_RANGE_FORGE }}"
        version-type: beta
        files: forge/build/libs/!(*-@(dev|sources|javadoc|slim)).jar
        java: Java ${{ env.java-version }}

    - name: Publish to Modrinth (Fabric)
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: |
        cd fabric
        ./gradlew modrinth

    - name: Publish to Modrinth (NeoForge)
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: |
        cd neoforge
        ./gradlew modrinth

    - name: Publish to Modrinth (Forge)
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      run: |
        cd forge
        ./gradlew modrinth

    - name: Collect release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-artifacts
        path: |
          fabric/build/libs/*.jar
          !fabric/build/libs/*-dev.jar
          !fabric/build/libs/*-sources.jar
          !fabric/build/libs/*-javadoc.jar
          forge/build/libs/*.jar
          !forge/build/libs/*-dev.jar
          !forge/build/libs/*-sources.jar
          !forge/build/libs/*-javadoc.jar
          !forge/build/libs/*-slim.jar
          neoforge/build/libs/*.jar
          !neoforge/build/libs/*-dev.jar
          !neoforge/build/libs/*-sources.jar
          !neoforge/build/libs/*-javadoc.jar
          !neoforge/build/libs/*-slim.jar
        if-no-files-found: warn

    - name: Download release artifacts
      uses: actions/download-artifact@v8
      with:
        name: release-artifacts
        path: dist

    - name: Generate release body
      run: |
        tag="${{ env.GITHUB_TAG_NAME }}"
        mc="${{ env.MC_VERSION }}"
        {
          echo '<div align="center">'
          echo
          echo "[![Release Downloads](https://img.shields.io/github/downloads/coolxitech/wsmc-kotlin/${tag}/total?style=flat-square&logo=github)](https://github.com/coolxitech/wsmc-kotlin/releases/${tag})"
          echo
          echo '</div>'
          echo
          echo '**Download for your mod loader:**'
          echo
          echo '| Loader | Download |'
          echo '| --- | --- |'
          for d in fabric forge neoforge; do
            jarfile=$(find dist -type f -path "*/${d}/build/libs/*.jar" ! -name "*-sources*" ! -name "*-dev*" ! -name "*-javadoc*" ! -name "*-slim*" | head -1)
            [ -z "$jarfile" ] && continue
            jar=$(basename "$jarfile")
            case "$d" in
              fabric)   name="Fabric";   color="DBD0B4" ;;
              forge)    name="Forge";    color="8B1E1E" ;;
              neoforge) name="NeoForge"; color="E97E25" ;;
            esac
            url="https://github.com/coolxitech/wsmc-kotlin/releases/download/${tag}/${jar}"
            echo "| ${name} | <a href='${url}'><img src='https://img.shields.io/badge/${name}-${mc}-${color}.svg'></a> <a href='https://gh-proxy.com/${url}'><img src='https://img.shields.io/badge/Mirror-gh--proxy-0366d6.svg'></a> |"
          done
          echo
          echo '---'
          echo
          cat CHANGELOG.txt
        } > release_body.md

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.GITHUB_TAG_NAME }}
        name: ${{ env.GITHUB_RELEASE_TITLE }}
        body_path: release_body.md
        files: dist/**/*.jar
        draft: false
        prerelease: false

