name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: true
        default: 'main'

env:
  java-version: '25'

permissions:
  contents: write

jobs:
  prepare:
    name: Detect loaders
    runs-on: ubuntu-latest
    outputs:
      loaders: ${{ steps.detect.outputs.loaders }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Detect loader directories
        id: detect
        run: |
          loaders=""
          for d in fabric forge neoforge; do
            if [ -d "$d" ]; then
              loaders="${loaders}\"$d\","
            fi
          done
          echo "loaders=[${loaders%,}]" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.loader }}
    needs: prepare
    if: needs.prepare.outputs.loaders != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(needs.prepare.outputs.loaders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # NeoForge (Gradle 8.10.2) cannot run on Java 25; use Java 21 there.
          java-version: ${{ matrix.loader == 'neoforge' && '21' || env.java-version }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ matrix.loader }}

      - name: Build
        run: |
          cd "${{ matrix.loader }}"
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
            !${{ matrix.loader }}/build/libs/*-dev.jar
            !${{ matrix.loader }}/build/libs/*-javadoc.jar
            !${{ matrix.loader }}/build/libs/*-slim.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        run: |
          mod_version=$(grep -E '^[[:space:]]*mod_version[[:space:]]*=' common.properties | sed -E 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//; s/[[:space:]]+$//')
          mc_version=$(grep -E '^[[:space:]]*minecraft_version[[:space:]]*=' common.properties | sed -E 's/^[[:space:]]*minecraft_version[[:space:]]*=[[:space:]]*//; s/[[:space:]]+$//')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_name="${{ github.ref_name }}"
          else
            tag_name="v${mod_version}-mc${mc_version}"
          fi
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${mc_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Generate release body
        run: |
          tag="${{ steps.meta.outputs.tag_name }}"
          mod="${{ steps.meta.outputs.mod_version }}"
          mc="${{ steps.meta.outputs.mc_version }}"
          {
            echo '<div align="center">'
            echo
            echo "[![Release Downloads](https://img.shields.io/github/downloads/coolxitech/wsmc-kotlin/${tag}/total?style=flat-square&logo=github)](https://github.com/coolxitech/wsmc-kotlin/releases/${tag})"
            echo
            echo '</div>'
            echo
            echo '**Download for your mod loader:**'
            echo
            echo '| Loader | Download |'
            echo '| --- | --- |'
            for d in fabric forge neoforge; do
              [ -d "$d" ] || continue
              case "$d" in
                fabric)   name="Fabric";   color="DBD0B4" ;;
                forge)    name="Forge";    color="8B1E1E" ;;
                neoforge) name="NeoForge"; color="E97E25" ;;
              esac
              url="https://github.com/coolxitech/wsmc-kotlin/releases/download/${tag}/wsmc-${mod}-${d}-${mc}.jar"
              echo "| ${name} | <a href=\"${url}\"><img src=\"https://img.shields.io/badge/${name}-${mc}-${color}.svg\"></a> <a href=\"https://gh-proxy.com/${url}\"><img src=\"https://img.shields.io/badge/Mirror-gh--proxy-0366d6.svg\"></a> |"
            done
            echo
            echo '---'
            echo
            cat CHANGELOG.txt
          } > release_body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          body_path: release_body.md
          files: dist/*
          draft: false
          prerelease: false
