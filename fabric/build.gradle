plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.5'
	id 'org.jetbrains.kotlin.jvm' version '2.4.20'
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

apply from: '../common.gradle'

loom {
	mods {
		"${project.archives_base_name}" {
			sourceSet sourceSets.main
		}
	}

	// runs.configureEach { vmArgs("-Dwsmc.debug=true") }
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Kotlin runtime is provided by Fabric Language Kotlin at runtime
	implementation "net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20"

	// javax.annotation.Nullable
	implementation 'com.google.code.findbugs:jsr305:3.0.1'
}


base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.dev_group

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand project.mergedProperties
	}
}

// configure the source folders
sourceSets {
	main {
		kotlin {
			srcDir "../src/main/kotlin"
		}
		resources {
			srcDir "../src/main/resources"
			srcDir "../src/generated/resources"
			exclude '.cache'
			exclude 'Thumbs.db'
		}
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"

	// Minecraft 26.1 and upwards uses Java 25.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
	jvmToolchain(25)
	compilerOptions {
		javaParameters.set(true)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName
	archiveClassifier.set("fabric-${project.minecraft_version}")

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	manifest {
		attributes('Implementation-Timestamp': new Date().toString())
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "wsmc-kotlin"
	versionNumber = "${project.mod_version}-mc${project.minecraft_version}+fabric"
	versionName = "WSMC ${project.mod_version} for Fabric ${project.minecraft_version}"
	versionType = "release"
	// MC 26.x is unobfuscated, so Loom 1.15 does not register a remapJar task.
	uploadFile = tasks.jar
	gameVersions = project.minecraft_versions_supported
	loaders = ["fabric"]
	changelog = file("../CHANGELOG.txt").text
	dependencies {
		required.project "fabric-language-kotlin"
	}
}
