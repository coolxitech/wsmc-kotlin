plugins {
	id 'fabric-loom' version '1.14.10'
	id 'org.jetbrains.kotlin.jvm' version '2.4.20'
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

apply from: '../common.gradle'

loom {
	mixin {
		defaultRefmapName = "wsmc.refmap.json"
	}

	// runs.configureEach { vmArgs("-Dwsmc.debug=true") }
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// javax.annotation.Nullable
	modImplementation 'com.google.code.findbugs:jsr305:3.0.1'

	// Netty's http and websocket support
	include(modImplementation(group: 'io.netty', name: 'netty-codec-http', version: project.netty_version))
}


base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.dev_group

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand project.mergedProperties
	}
}

// configure the source folders
sourceSets {
	main {
		kotlin {
			srcDir "../src/main/kotlin"
		}
		resources {
			srcDir "../src/main/resources"
			srcDir "../src/generated/resources"
			exclude '.cache'
			exclude 'Thumbs.db'
		}
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"

	// Minecraft 1.20.5 and upwards uses Java 21.
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
	jvmToolchain(25)
	compilerOptions {
		javaParameters.set(true)
		jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	manifest {
		attributes('Implementation-Timestamp': new Date().toString())
	}
}

// https://github.com/FabricMC/fabric-loom/issues/452
afterEvaluate {
	tasks.remapJar {
		archiveClassifier.set("fabric")
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "wsmc-kotlin"
	versionNumber = "${project.mod_version}-mc${project.minecraft_version}+fabric"
	versionName = "WSMC ${project.mod_version} for Fabric ${project.minecraft_version}"
	versionType = "release"
	uploadFile = tasks.remapJar
	gameVersions = project.minecraft_versions_supported
	loaders = ["fabric"]
	changelog = file("../CHANGELOG.txt").text
	dependencies {
		required.project "fabric-language-kotlin"
	}
}
