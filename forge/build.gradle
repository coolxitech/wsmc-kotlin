plugins {
	id 'java'
	id 'idea'
	id 'eclipse'
	id 'maven-publish'
	id 'org.jetbrains.kotlin.jvm' version '2.4.20'
	id 'net.minecraftforge.gradle' version '[7.0.11,8.0)'
	id 'net.minecraftforge.jarjar' version '0.2.3'
	id 'net.minecraftforge.renamer' version '1.0.14'
}

apply from: '../common.gradle'

project.ext.mod_id = project.archives_base_name;

// These are defined in ../common.properties
version = project.mod_version
group = project.dev_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base {
	archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

kotlin {
	jvmToolchain(17)
	compilerOptions {
		javaParameters.set(true)
	}
}

// 移除空的 test sourceSet：renamer 的 enableMixinRefmaps 会为每个 sourceSet（含 test）
// 生成 refmap 并挂到 jar 上，Kotlin 插件又让 compileTestKotlin 依赖 main 的 jar，
// 形成 jar -> compileTestJava -> compileTestKotlin -> jar 的循环依赖。
sourceSets.remove(sourceSets.test)

renamer.enableMixinRefmaps {
	config "${mod_id}.mixins.json"
}

renamer.classes(tasks.named('jar', Jar)) {
	archiveClassifier = 'srg'
	// We need to use the generated mappings, which includes things generated by the annotation processor
	mappings renamer.mixin.generatedMappings
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
	mappings channel: 'official', version: project.minecraft_version

	runs {
		configureEach {
			workingDir.convention layout.projectDirectory.dir('run')

			systemProperty 'mixin.debug', 'true'
			systemProperty 'mixin.debug.export', 'true'
			systemProperty 'mixin.debug.verbose', 'true'

			systemProperty 'forge.enabledGameTestNamespaces', mod_id
		}

		register('client')

		register('server') {
			args '--nogui'
		}
	}
}

// Include resources generated by data generators.
sourceSets {
	main {
		kotlin {
			srcDir "../src/main/kotlin"
		}
		resources {
			srcDir "../src/main/resources"
			srcDir "../src/generated/resources"
			exclude '.cache'
			exclude 'Thumbs.db'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

// Creates the jarJar configuration.
// This creates the 'jarJar' task, which by default has a classifier of 'all', with a base of the 'jar' task
// For more info see https://github.com/MinecraftForge/JarJar/blob/main/jarjar-gradle/src/main/java/net/minecraftforge/jarjar/gradle/JarJarExtension.java
jarJar.register()

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:" + project.minecraft_version + "-" + project.forge_version)

	// Apply Mixin AP
	annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"

	// MixinExtra
	// This will bundle the jar and set the constraints to [0.4.1,)
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1"))

	// Netty's http and websocket support
	implementation(jarJar("io.netty:netty-codec-http:${project.netty_version}"))
}

renamer.mappings(minecraft.dependency.toSrg)

tasks.named('jar', Jar).configure {
	version version
	manifest {
		attributes([
			"Specification-Title": mod_id,
			"Specification-Vendor": "Rikka0w0",
			"Specification-Version": "1", // We are version 1 of ourselves
			"Implementation-Title": project.name,
			"Implementation-Version": project.jar.archiveVersion,
			"Implementation-Vendor" :"Rikka0w0",
			"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
	archiveClassifier = 'forge-slim'
}

tasks.named('jarJar') {
	archiveClassifier = "forge"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
	var replaceProperties = [
			minecraft_version_range: minecraft_version_range,
			forge_version_range: forge_version_range,
			loader_version_range: loader_version_range,
			mod_id: mod_id,
			mod_version: mod_version,
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}

	// forge 是 srg-at-runtime，需要 srg refmap；Kotlin 编译不走 mixin AP，
	// 用 forge 目录下手工维护的 srg refmap 覆盖共享的 identity 版本（neoforge/fabric 用 identity）。
	def srgRefmap = layout.projectDirectory.file('wsmc.refmap.json')
	inputs.file(srgRefmap)
	doLast {
		new File(destinationDir, 'wsmc.refmap.json').text = srgRefmap.asFile.text
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

eclipse {
	// Run everytime eclipse builds the code
	//autoBuildTasks genEclipseRuns
	// Run when importing the project
	synchronizationTasks 'genEclipseRuns'
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
	it.kotlin.destinationDirectory = dir
}
